services:
  db:
    image: postgres:16
    container_name: courses_collaboratives_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: famille
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: courses_collaboratives
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Ces scripts ne s'exécutent automatiquement que si le volume est vide
      # (première initialisation du conteneur).
      - ../sql/migration_up.sql:/docker-entrypoint-initdb.d/01_migration_up.sql:ro
      - ../sql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

volumes:
  db_data: